[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-bridge"
version = "0.1.2"
description = "An integrated Windows/Omarchy companion for Lan Mouse"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[project.scripts]
lan-bridge = "lanbridge.cli:main"

[tool.setuptools.packages.find]
include = ["lanbridge*"]
